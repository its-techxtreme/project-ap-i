# Project AP-I — nginx reverse proxy example (DEFERRED — future VPS only)
# Not required for local MVP. When deploying to a remote VPS, copy to
# /etc/nginx/sites-available/project-api and adjust for your domain.

server {
    listen 80;
    server_name REPLACE_WITH_YOUR_DOMAIN;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_YOUR_DOMAIN;

    # Worker API (internal — restrict access)
    location /worker/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Phase 9 will add IP restriction here
    }
}
